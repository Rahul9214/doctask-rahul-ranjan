name: project-assurance-foundation

# Local development contract: POSTGRES_PASSWORD must contain only ASCII letters, digits, and
# underscores because this simple Compose path inserts the same literal value into DATABASE_URL.
services:
  db:
    image: pgvector/pgvector:0.8.1-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_assurance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only}
      POSTGRES_USER: ${POSTGRES_USER:-project_assurance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-project_assurance} -d ${POSTGRES_DB:-project_assurance}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: Project Assurance Register
      APP_VERSION: 0.8.0
      CURRENT_PHASE: Phase 08 — MCP Operations
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-project_assurance}:${POSTGRES_PASSWORD:-local_only}@db:5432/${POSTGRES_DB:-project_assurance}
      SOURCE_STORAGE_PATH: /data/source-files
      WATCH_INPUT_PATH: /data/watch-inbox
      WATCH_POLL_SECONDS: 2
      WATCH_STABLE_POLLS: 2
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      READINESS_TIMEOUT_SECONDS: 5
      MODEL_PROVIDER: deterministic
    volumes:
      - source_files:/data/source-files
      - watch_inbox:/data/watch-inbox
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
  source_files:
  watch_inbox:
